# arduino-cli sketch profile - pins the core and library versions so the build
# is reproducible (locally and in CI).
#   arduino-cli compile --profile default src
profiles:
  default:
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=custom,CDCOnBoot=cdc,FlashMode=qio
    platforms:
      - platform: esp32:esp32 (3.0.7)
    libraries:
      - GFX Library for Arduino (1.4.9)
      - PNGdec (1.0.1)
      - ArduinoJson (7.1.0)
      - WiFiManager (2.0.17)
      - ElegantOTA (3.1.6)
      - ESP Async WebServer (3.3.12)
      - Async TCP (3.2.10)

default_profile: default
